// MLSH's bundled MLCP runner. This project exists solely so that `mlsh mlcp`
// can drive MarkLogic Content Pump through ml-gradle's MlcpTask, following the
// pattern documented at https://github.com/marklogic/ml-gradle (see
// examples/mlcp-project). MLSH's Node code (cli/commands/mlcp.js) resolves job
// files and environments, then invokes `gradlew --no-daemon mlshMlcp` with
// Gradle project properties (-P, not environment variables - env vars are
// part of a Gradle daemon's identity/reuse fingerprint, and --no-daemon plus
// -P keeps every single invocation fully deterministic and easy to reason
// about, which matters a lot when debugging a connection problem):
//
//   mlsh.mlcp.command      "IMPORT", "EXPORT", or "COPY"
//   mlsh.mlcp.options      JSON object of MlcpTask property assignments
//   mlsh.mlcp.extraArgs    JSON array of extra "-option value" mlcp args
//   mlsh.mlcp.jvmArgs      JSON array of extra JVM args for mlcp's forked
//                          process (e.g. a per-environment trust store, for
//                          environments configured with insecure=true)
//
// Credentials and connection details always flow through these properties at
// run time; they are never written to disk or passed as visible arguments to
// mlsh itself.
import groovy.json.JsonSlurper

plugins {
	id "com.marklogic.ml-gradle" version "6.2.0"
}

repositories {
	mavenCentral()
}

configurations {
	mlcp
}

dependencies {
	mlcp "com.marklogic:mlcp:12.0.1"

	// mlcp 11.2+ dropped logback as a direct dependency; without it, mlcp
	// prints no logging output at all.
	mlcp "ch.qos.logback:logback-classic:1.5.32"

	// Without a logback config, Hadoop's own (very chatty, DEBUG-level)
	// logging floods the output and buries mlcp's own progress/error
	// messages. lib/logback.xml keeps the root logger at WARN and only
	// com.marklogic at INFO, matching ml-gradle's own mlcp-project example.
	mlcp files("lib")
}

tasks.register("mlshMlcp", com.marklogic.gradle.task.MlcpTask) {
	classpath = configurations.mlcp
	command = (findProperty("mlsh.mlcp.command") ?: "IMPORT").toString()

	def optionsJson = findProperty("mlsh.mlcp.options") ?: "{}"
	def options = new JsonSlurper().parseText(optionsJson.toString())
	options.each { key, value -> setProperty(key.toString(), value) }

	def extraArgsJson = findProperty("mlsh.mlcp.extraArgs") ?: "[]"
	def extraArgs = new JsonSlurper().parseText(extraArgsJson.toString())
	if (extraArgs) {
		args = extraArgs.collect { it.toString() }
	}

	def jvmArgsJson = findProperty("mlsh.mlcp.jvmArgs") ?: "[]"
	def extraJvmArgs = new JsonSlurper().parseText(jvmArgsJson.toString())
	if (extraJvmArgs) {
		jvmArgs = extraJvmArgs.collect { it.toString() }
	}
}
