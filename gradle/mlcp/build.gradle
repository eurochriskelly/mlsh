// MLSH's bundled MLCP runner. This project exists solely so that `mlsh mlcp`
// can drive MarkLogic Content Pump through ml-gradle's MlcpTask, following the
// pattern documented at https://github.com/marklogic/ml-gradle (see
// examples/mlcp-project). MLSH's Node code (cli/commands/mlcp.js) resolves job
// files and environments, then invokes `gradlew mlshMlcp` with two environment
// variables:
//
//   MLSH_MLCP_COMMAND            "IMPORT", "EXPORT", or "COPY"
//   MLSH_MLCP_OPTIONS_JSON       JSON object of MlcpTask property assignments
//   MLSH_MLCP_EXTRA_ARGS_JSON    JSON array of extra "-option value" mlcp args
//   MLSH_MLCP_JVM_ARGS_JSON      JSON array of extra JVM args for mlcp's forked
//                                process (e.g. a per-environment trust store,
//                                for environments configured with insecure=true)
//
// Credentials and connection details always flow through these environment
// variables at run time; they are never written to disk or passed as
// visible command-line arguments.
import groovy.json.JsonSlurper

plugins {
	id "com.marklogic.ml-gradle" version "6.2.0"
}

repositories {
	mavenCentral()
}

configurations {
	mlcp
}

dependencies {
	mlcp "com.marklogic:mlcp:12.0.1"

	// mlcp 11.2+ dropped logback as a direct dependency; without it, mlcp
	// prints no logging output at all.
	mlcp "ch.qos.logback:logback-classic:1.5.32"

	// Without a logback config, Hadoop's own (very chatty, DEBUG-level)
	// logging floods the output and buries mlcp's own progress/error
	// messages. lib/logback.xml keeps the root logger at WARN and only
	// com.marklogic at INFO, matching ml-gradle's own mlcp-project example.
	mlcp files("lib")
}

tasks.register("mlshMlcp", com.marklogic.gradle.task.MlcpTask) {
	classpath = configurations.mlcp
	command = System.getenv("MLSH_MLCP_COMMAND") ?: "IMPORT"

	def optionsJson = System.getenv("MLSH_MLCP_OPTIONS_JSON") ?: "{}"
	def options = new JsonSlurper().parseText(optionsJson)
	options.each { key, value -> setProperty(key.toString(), value) }

	def extraArgsJson = System.getenv("MLSH_MLCP_EXTRA_ARGS_JSON") ?: "[]"
	def extraArgs = new JsonSlurper().parseText(extraArgsJson)
	if (extraArgs) {
		args = extraArgs.collect { it.toString() }
	}

	def jvmArgsJson = System.getenv("MLSH_MLCP_JVM_ARGS_JSON") ?: "[]"
	def extraJvmArgs = new JsonSlurper().parseText(jvmArgsJson)
	if (extraJvmArgs) {
		jvmArgs = extraJvmArgs.collect { it.toString() }
	}
}
